# PhysioBook — base stack: postgres · mailpit · backend · frontend.
#
# This file is the CI/production-like definition: images are built from the
# Dockerfiles in docker/, nothing is bind-mounted, and the app services run
# their compiled/built output. It is what the CI smoke test brings up.
#
# For local development, docker-compose.override.yml is picked up automatically
# and layers hot-reload on top — `docker compose up` gets you both. To reproduce
# what CI runs, opt out of the override explicitly:
#
#   docker compose -f docker-compose.yml up
#
# All credentials and host ports come from the root .env (seeded from
# .env.example). Values are referenced without defaults on purpose: a missing
# .env should fail loudly at `up`, not boot a stack with surprise credentials.
#
# No service sets a restart policy here, deliberately: a crash-looping container
# never reaches `exited`, so `up --wait` cannot fail fast on it and the CI smoke
# test would burn its whole timeout instead of reporting the crash. The dev
# override adds `restart: unless-stopped`, where surviving a Docker Desktop
# restart is worth more than a fast failure.

name: physiobook

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - '${POSTGRES_PORT}:5432'
    volumes:
      # Postgres 18+ stores data in a major-version subdirectory and refuses to
      # boot if the volume is mounted at the old /var/lib/postgresql/data path
      # ("Counter to that, there appears to be PostgreSQL data in ... (unused
      # mount/volume)"). Mount the parent instead — see
      # https://github.com/docker-library/postgres/pull/1259.
      - postgres-data:/var/lib/postgresql
      # Extensions (btree_gist, citext). The official image runs everything in
      # this directory on FIRST boot only — an existing volume is never
      # re-initialised, so changes here need `docker compose down -v`.
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/00-extensions.sql:ro
    healthcheck:
      # pg_isready is the port-level check for Postgres: it opens a real
      # connection, so it only passes once the server accepts queries. A bare
      # TCP probe would go green during initdb, while the database is still
      # being created — and dependent services would start too early.
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.30.4
    environment:
      # Keep captured mail in memory: it is throwaway test data, and a fresh
      # inbox per run is what makes mail assertions deterministic.
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${MAILPIT_SMTP_PORT}:1025' # SMTP — what the backend sends to
      - '${MAILPIT_UI_PORT}:8025' # web UI — where you read the messages
    healthcheck:
      # Mailpit ships its own probe; the image has no shell or curl to script
      # a check with.
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      # Context is the repo root so pnpm can see the workspace and lockfile.
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    environment:
      NODE_ENV: ${NODE_ENV}
      BACKEND_PORT: ${BACKEND_PORT}
      # Built from the POSTGRES_* parts rather than reusing DATABASE_URL: that
      # variable points at localhost for host-side tools, which inside this
      # container would mean the container itself.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Signing key for access tokens (E1.2). No default, like every other value
      # here: backend/src/config/env.ts refuses to boot without it, and a
      # compose-level fallback would quietly hand every deployment the same one.
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS}
      # Session lifetime and the auth rate limit (E1.3). Like everything else
      # here they carry no default: config/env.ts has the defaults, and a second
      # set living in this file is a second set to drift.
      REFRESH_TTL_SECONDS: ${REFRESH_TTL_SECONDS}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX}
      AUTH_RATE_LIMIT_WINDOW_SECONDS: ${AUTH_RATE_LIMIT_WINDOW_SECONDS}
      TRUST_PROXY: ${TRUST_PROXY}
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    # Deliberately NOT published. The frontend container proxies /auth to this
    # service, and TRUST_PROXY=1 makes the API take the client address from the
    # X-Forwarded-For that proxy writes. A second, direct route in from the host
    # would be a route on which the client writes that header itself — and the
    # auth rate limit, which exists to make password guessing expensive, would
    # be evadable by varying it. One way in is what keeps the limit honest.
    # Reach the API through the frontend origin; the dev override republishes
    # this port for debugging.
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      # TCP-level: connect to the listening port and hang up. Uses node because
      # the alpine runtime has no curl and busybox wget would turn this into an
      # HTTP-level assertion.
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('node:net').connect(Number(process.env.BACKEND_PORT),'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      target: runtime
    ports:
      - '${FRONTEND_PORT}:80'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # TCP-level probe against nginx's listening port (busybox nc, present in
      # the alpine image).
      test: ['CMD-SHELL', 'nc -z 127.0.0.1 80']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
