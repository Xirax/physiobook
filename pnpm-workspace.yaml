packages:
  - 'frontend'
  - 'backend'
  - 'db'
  - 'shared'
  - 'e2e'
# pnpm blocks dependency install scripts by default. Each entry here is a
# deliberate exception, reviewed once and recorded rather than re-approved
# interactively on every machine.
allowBuilds:
  # Vite's bundler. Its install script fetches the platform-specific binary;
  # without it Vite cannot start at all.
  esbuild: true

  # Password hashing (E1.2). bcrypt 6 is built with `prebuildify --napi
  # --tag-libc`, so the published tarball already carries binaries for every
  # platform this repo runs on — including musl, which is what lets the
  # node:22-alpine runtime image work without a compiler toolchain. Its install
  # script is `node-gyp-build`, which only *selects* one of those prebuilds;
  # denying it would leave the module unloadable rather than merely unoptimised.
  bcrypt: true

  # The three below arrive under testcontainers → dockerode → ssh2. Their build
  # scripts only compile optional native speedups for SSH transport, which we
  # never use: Testcontainers talks to the local Docker daemon over a socket or
  # named pipe. ssh2 and protobufjs both fall back to pure JS, so building them
  # would cost a compiler toolchain on every machine and in CI to speed up a
  # code path this repo does not execute. Denied explicitly rather than left
  # unanswered, so `pnpm install` stays silent instead of nagging.
  cpu-features: false
  protobufjs: false
  ssh2: false

  # Arrives under sass (E1.5). Its build script compiles the native file-watcher
  # sass uses for its own `--watch` CLI, which nothing here runs: Vite compiles
  # SCSS through sass's compile API and owns the watching itself. Denied rather
  # than left unanswered so `pnpm install` stays silent.
  '@parcel/watcher': false
