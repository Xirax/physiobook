# Serves the built SPA in the production-like stack.
# The dev stack does not use this file at all — docker-compose.override.yml
# swaps the whole service over to the Vite dev server.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: any unknown path is a React route, not a 404, so it
    # must fall through to index.html rather than nginx's error page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file that must not be cached: it is what points at
    # the current hashed bundles after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
