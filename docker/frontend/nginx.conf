# Serves the built SPA in the production-like stack.
# The dev stack does not use this file at all — docker-compose.override.yml
# swaps the whole service over to the Vite dev server.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing: any unknown path is a React route, not a 404, so it
    # must fall through to index.html rather than nginx's error page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The API is served from this origin rather than its own, so the browser
    # never makes a cross-origin call and the stack needs no CORS layer. The
    # paths are NOT rewritten: the refresh cookie is scoped `path=/auth`, so it
    # comes back only to a URL that still starts with /auth. Mirrors the `proxy`
    # list in frontend/vite.config.ts — the two must be changed together, and a
    # path missing here is a 404 that looks like a logged-out user.
    location /auth/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is the one file that must not be cached: it is what points at
    # the current hashed bundles after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
